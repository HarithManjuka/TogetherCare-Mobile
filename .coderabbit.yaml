# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "dev"
      - "feature/.*"
      - ".*"
  path_instructions:
    - path: "src/screens/elderly/**"
      instructions: "Enforce high contrast UI standards, readable font sizes, and accessible touch targets >= 48dp."
    - path: "src/screens/volunteer/**"
      instructions: "Verify NIC and Student ID validation handling and secure credential checks."

chat:
  auto_reply: true